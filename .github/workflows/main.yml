name: Windows 2025 Cloud RDP

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="Allow-RDP"
          netsh advfirewall firewall add rule name="Allow-RDP" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create Administrative User
        shell: powershell
        run: |
          $Username = "CloudAdmin"
          $Password = "WinServer#2026!"
          
          # Space fixed between command and argument
          $SecurePassword = ConvertTo-SecureString -String$Password -AsPlainText -Force

          New-LocalUser -Name $Username -Password$SecurePassword -FullName "Cloud Administrator" -Description "RDP Access User" -AccountNeverExpires
          
          Add-LocalGroupMember -Group "Administrators" -Member $Username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username

          Write-Host "Successfully created user: $Username"

      - name: Install & Configure Tailscale
        shell: powershell
        run: |
          $InstallerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $InstallerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$InstallerPath`" /quiet /norestart" -Wait
          Remove-Item $InstallerPath -Force

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname="win2025-$env:GITHUB_RUN_ID"

          $TailscaleIP =$null
          for ($i = 0; $i -lt 10; $i++) {
              $TailscaleIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if ($TailscaleIP) { break }
              Start-Sleep -Seconds 3
          }

          if (-not $TailscaleIP) {
              Write-Error "Failed to obtain Tailscale IP address."
              exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "TS_IP=$TailscaleIP"

      - name: Print Credentials & Keep Session Active
        shell: powershell
        run: |
          Write-Host "`n========================================================"
          Write-Host "               RDP SERVER READY (WINDOWS 2025)          "
          Write-Host "========================================================"
          Write-Host " IP Address : $env:TS_IP"
          Write-Host " Port       : 3389"
          Write-Host " Username   : CloudAdmin"
          Write-Host " Password   : WinServer#2026!"
          Write-Host "========================================================`n"

          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Session active. Listening on $env:TS_IP:3389"
              Start-Sleep -Seconds 300
          }
